name: deploy telemetry worker

# Keeps the deployed collector in lockstep with the repo: the schema-2 rollout was delayed once
# because the Worker had to be deployed by hand and the running copy still rejected v2 beacons.
on:
  push:
    branches: [main]
    paths:
      - "telemetry/worker.js"
      - "telemetry/worker.test.mjs"
      - "telemetry/wrangler.toml"
      - "telemetry/migrations/**"
      - ".github/workflows/deploy-telemetry.yml"

  # Allows manual trigger from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # An environment can hold the Cloudflare secrets and limit them to main (Settings >
    # Environments > production > Deployment branches), so no other branch's workflow can read them.
    environment: production
    # Serialize deploys; a rapid pair of pushes must not race each other.
    concurrency:
      group: deploy-telemetry
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runner's own Node; the tests need no dependencies. A collector that fails them would
      # drop every beacon, so it never deploys.
      - name: Test Worker
        run: node --experimental-detect-module --test telemetry/worker.test.mjs

      # The table first: a Worker that writes a column the table lacks would lose those events.
      # Applying is idempotent, so a deploy without a new migration applies nothing.
      - name: Migrate D1 and deploy Worker
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: telemetry
          wranglerVersion: "4.148.0"
          command: |
            d1 migrations apply DB --remote
            deploy
