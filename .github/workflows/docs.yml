# Build the Zensical documentation site (docs/ + zensical.toml) and publish it at
# https://docs.tagger.photo, a Cloudflare Worker that serves the static files (docs.wrangler.toml).
# The old address, https://jbsilva.github.io/photo-tagger/, stays on GitHub Pages as redirect pages.
#
# Runs on pushes to main that touch the docs sources, or manually from the Actions tab.
name: docs

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "zensical.toml"
      - "docs.wrangler.toml"
      - "scripts/pages_redirects.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# One deployment at a time; do not cancel a deploy that is already in flight.
concurrency:
  group: docs-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # The environment that holds the Cloudflare secrets, as in deploy-telemetry.yml.
    environment:
      name: production
      url: https://docs.tagger.photo
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Build site
        # --only-group docs: the docs build needs zensical only, not the app's dependencies.
        run: uv run --only-group docs --locked --no-build zensical build --clean

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.148.0"
          command: deploy --config docs.wrangler.toml

      - name: Write redirect pages
        run: uv run --only-group docs --locked --no-build python scripts/pages_redirects.py site redirects

      - name: Upload redirect pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: redirects

  redirect:
    # After the deploy, so the old address never sends a reader to a page that is not there yet.
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
