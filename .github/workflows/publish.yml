name: Publish to PyPI

on:
  release:
    types: [published]

  push:
    tags:
      - "v*"

  # Allows manual trigger from Actions tab
  workflow_dispatch:

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Job-level so the publish jobs get no repository access at all; they only
    # download the built artifact and need id-token for trusted publishing.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # No dependency cache in the workflow that builds what gets published: a cache entry
          # poisoned from a lower-privileged run would end up inside the release artifact. This
          # runs once per release, so the cold download costs little.
          enable-cache: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: "pyproject.toml"

      - name: Run tests
        # A tag push or a manually-dispatched release never triggers tests.yml, so without this
        # gate a broken commit could be built and published without a single test running on it.
        run: |
          uv sync --locked --no-build --no-binary-package photo-tagger --group test
          uv run --locked --no-build --no-binary-package photo-tagger pytest

      - name: Build package
        run: uv build

      - name: Store the distribution packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    # Real PyPI only after the same artifacts landed on TestPyPI in this run: the staging step
    # is a gate, not a parallel best-effort mirror.
    needs: [build, publish-to-testpypi]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'release'

    environment:
      name: pypi
      url: https://pypi.org/p/photo-tagger

    permissions:
      id-token: write # Required for OIDC trusted publishing

    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  publish-to-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Runs for tag pushes AND for the release event, where it gates publish-to-pypi: a release
    # re-upload of an already-staged version is a no-op thanks to skip-existing below.

    environment:
      name: testpypi
      url: https://test.pypi.org/p/photo-tagger

    permissions:
      id-token: write # Required for OIDC trusted publishing

    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true # Do not fail if the version already exists on TestPyPI (tag re-run)
