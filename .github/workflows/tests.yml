name: tests

on:
  push:
    branches: ["**"]
  pull_request:

# A PR branch runs under both triggers; cancel the superseded run instead of paying for it twice.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Windows is here because it has bitten before: file locking and exiftool path handling
        # both shipped Windows-only bugs that no ubuntu/macos leg could catch, while conda-forge
        # ships a Windows package. Tests needing a real exiftool binary skip when it is absent.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        # --locked fails on a drifted uv.lock instead of silently re-resolving it.
        # --no-build keeps third-party sdist build code from running during install;
        # --no-binary-package exempts photo-tagger itself, which only exists as source.
        run: uv sync --locked --no-build --no-binary-package photo-tagger --group test

      - name: Run tests
        run: uv run --locked --no-build --no-binary-package photo-tagger pytest

      - name: Upload coverage to Codecov
        # Upload even when a test fails: pytest-cov still writes the report at session end.
        # One OS is enough for coverage; the macOS leg only gates behavior.
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: reports/coverage.xml

      - name: Upload coverage report
        # Shared with the sonarcloud job so the suite runs once and both tools report the same data.
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: reports/coverage.xml
          retention-days: 1

  gui-tests:
    # The offscreen Qt suite: without this job the [gui] extra never gets installed in CI, so
    # tests/test_gui.py importorskips PySide6 and the whole desktop app ships untested.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "pyproject.toml"

      - name: Install Qt runtime libraries and ExifTool
        # Qt's offscreen platform still links EGL/xkbcommon; some GUI tests read real metadata.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libopengl0 libxkbcommon0 exiftool

      - name: Install dependencies (with the gui extra)
        run: uv sync --locked --no-build --no-binary-package photo-tagger --group test --extra gui

      - name: Ensure PySide6 is importable
        # Fail loudly here rather than letting importorskip silently skip the whole suite.
        run: uv run --locked --no-build --no-binary-package photo-tagger python -c "import PySide6"

      - name: Run GUI tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --locked --no-build --no-binary-package photo-tagger pytest tests/test_gui.py

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "pyproject.toml"

      - name: Install dev dependencies
        run: uv sync --locked --no-build --no-binary-package photo-tagger --group dev --group test

      - name: ruff check
        run: uv run --locked --no-build --no-binary-package photo-tagger ruff check .

      - name: ruff format
        run: uv run --locked --no-build --no-binary-package photo-tagger ruff format --check .

      - name: zuban type check
        run: uv run --locked --no-build --no-binary-package photo-tagger zuban check

      - name: pycroscope static analysis
        # Same invocation as the pre-commit hook; a hookless fork PR must not bypass it.
        run: >-
          uv run --locked --no-build --no-binary-package photo-tagger
          pycroscope --config-file pyproject.toml

      - name: import-linter layering
        # The contracts under [tool.importlinter]; like pycroscope, a hookless fork PR runs them too.
        run: uv run --locked --no-build --no-binary-package photo-tagger lint-imports

      - name: Check version sync
        # Invoke via `python` so uv runs this in the project env, not PEP 723 script mode, where
        # `--locked` would demand a per-script lockfile that does not exist.
        run: >-
          uv run --locked --no-build --no-binary-package photo-tagger
          python scripts/check_version_sync.py

  sonarcloud:
    # Reuse the coverage report from unit-tests instead of running the suite twice.
    needs: unit-tests
    # Skip the heavy scan on Renovate's automated dependency PRs (they touch lockfile/constraints,
    # not source). The lint + unit-tests jobs still gate those PRs.
    if: github.actor != 'renovate[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        # Full history so SonarQube Cloud can blame issues to commits and detect new code.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "pyproject.toml"

      - name: Install dev dependencies
        run: uv sync --locked --no-build --no-binary-package photo-tagger --group dev

      - name: Create reports directory
        run: mkdir -p reports

      # ruff and bandit reports feed sonar.python.{ruff,bandit}.reportPaths. exit-zero keeps the
      # JSON written and the job green: the lint job is the gate for ruff, CodeQL/bandit for security.
      - name: Generate ruff report
        run: |
          uv run --locked --no-build --no-binary-package photo-tagger ruff check \
            --output-format=json \
            --output-file=reports/ruff_report.json \
            --exit-zero \
            .

      - name: Generate bandit report
        run: |
          uv run --locked --no-build --no-binary-package photo-tagger bandit \
            --configfile pyproject.toml \
            --recursive \
            --format json \
            --output reports/bandit_report.json \
            --exit-zero \
            .

      - name: Download coverage report
        # coverage.xml is produced by unit-tests; feeds sonar.python.coverage.reportPaths.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-report
          path: reports

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_SCANNER_SKIP_JRE_PROVISIONING: true
          # Fill the ${env.*} placeholders in sonar-project.properties. Not secret (also in
          # .sonarlint/connectedMode.json). EU region uses the default sonarcloud.io host, so
          # SONAR_HOST_URL is intentionally omitted.
          SONAR_ORGANIZATION: jbsilva
          SONAR_PROJECT_KEY: jbsilva_photo-tagger
