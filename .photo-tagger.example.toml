# photo-tagger config example
#
# Copy this file to one of the locations below and uncomment the keys you want.
# Search order (first match wins):
#   1. $PHOTO_TAGGER_CONFIG
#   2. ./.photo-tagger.toml                 (project-local)
#   3. ~/.config/photo-tagger/config.toml   (user-wide)
#
# CLI flags always win over values set here.
#
# Note: input paths, --skip-from, and --append-to-skip-file are NOT read from
# this file. Pass them on the command line each run.

# --- top-level ----------------------------------------------------------------

# extensions = "cr3,jpg"      # comma-separated, case insensitive
# recursive = false
# workers = 1                 # photos processed concurrently

# --- provider -----------------------------------------------------------------

[provider]
# provider_name = "lmstudio"  # "ollama", "lmstudio", "llamacpp", or "openai"
# api_base_url = "http://localhost:1234/v1"
# model_name = "qwen/qwen3-vl-30b"
# api_key = "..."             # prefer env vars: LM_STUDIO_API_KEY, OLLAMA_API_KEY, OPENAI_API_KEY
# retries = 5

# --- inference ----------------------------------------------------------------

[inference]
# temperature = 0.2
# max_tokens = 1200
# timeout_seconds = 60.0      # per-image hard cap; retry loop handles the abort
# frequency_penalty = 0.5     # suppresses chant-style token loops
# jpeg_dimensions = 1280      # max edge of the resized JPEG sent to the model
# jpeg_quality = 80

# --- output -------------------------------------------------------------------

[output]
# preserve_keywords = true    # false = overwrite existing keywords
# preserve_title = false      # true = keep the title a photo already has
# preserve_description = false # true = keep the description a photo already has
# write_description = true
# write_title = true
# write_copyright = true     # false = skip the [copyright] block below
# backup_xmp = true           # ExifTool _original backup
# sidecar_mode = "all"        # "none" = embed; "raw" = sidecar for RAW only; "both" = each
# dry_run = false
# max_keywords = 15           # cap AI keywords kept per photo before merging
# vocabulary = "keywords.txt" # Lightroom keyword export, or one term/path per line
# vocabulary_strict = false   # true = drop keywords the vocabulary does not cover
# session_gap_minutes = 60    # group photos into shoots this far apart and harmonize each

# --- copyright ----------------------------------------------------------------
#
# The fields no model can guess. Written by every tagging run, and by
# `photo-tagger set` on its own. {year} is the year the photo was taken.

[copyright]
# artist = "Your Name"        # EXIF:Artist, XMP-dc:Creator, IPTC:By-line
# copyright_notice = "Copyright (c) {year} {artist}, All rights reserved"
# rights = "© {year} {artist}, All rights reserved"   # XMP-dc:Rights only
# marked = true               # XMP-xmpRights:Marked; false = public domain
# set_tags = ["XMP-xmpRights:WebStatement=https://example.com/terms"]

# --- filter -------------------------------------------------------------------

[filter]
# skip_tagged = false         # skip files that already have keywords/title/description
# newer_than = "2024-01-01"   # ISO 8601; naive timestamps treated as local time
# older_than = "2025-01-01"

# --- artifacts ----------------------------------------------------------------

[artifacts]
# summary_file = "summary.json"
# prompt_file = "prompt.txt"
# cache_file = ".photo-tagger-cache.db"  # SQLite cache of model outputs; safe to delete
# lock_file  = ".photo-tagger.lock"
# undo_log = true             # false = do not record what the run writes (no `undo`)

# --- display ------------------------------------------------------------------

[display]
# progress_bar = true         # auto-disabled when stderr is not a tty
# json_output = false         # NDJSON line per photo on stdout
# notify = false              # desktop notification when the batch ends
# notify_sound = false        # play a sound with it (implies notify)

# --- logging ------------------------------------------------------------------

[log]
# file_log_level = "DEBUG"    # DEBUG | INFO | WARNING | ERROR | CRITICAL | OFF
# console_log_level = "INFO"
# log_folder = "logs"

# --- desktop window only ------------------------------------------------------

[gui]
# save_after_generating = false  # true = write each run's photos when it finishes
