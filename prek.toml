# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "check-added-large-files" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "debug-statements" },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending" },
  { id = "trailing-whitespace" },
]

[[repos]]
repo = "https://github.com/astral-sh/uv-pre-commit"
rev = "0.13.0"
hooks = [{ id = "uv-lock" }]

# Docformatter: format docstrings and make sure we use 100 columns.
# See [tool.docformatter] in pyproject.toml. Must run before ruff.
# Excluded files:
#   - errors.py: blank-line conflict with Ruff
#   - test_locking.py: docformatter mistakes the indented triple-quoted docstring
#     Drop this exclusion once https://github.com/PyCQA/docformatter/issues/344 is fixed.
#   - telemetry/dashboard.py: a marimo notebook full of mo.md("""...""") calls; docformatter
#     treats those markdown strings as docstrings and reflows them destructively. Ruff formats it.
[[repos]]
repo = "https://github.com/PyCQA/docformatter"
rev = "v1.7.8"
hooks = [
  { id = "docformatter", args = [
    "--in-place",
    "--config",
    "./pyproject.toml",
  ], exclude = '^(src/photo_tagger/errors\.py|tests/test_locking\.py|telemetry/dashboard\.py)$' },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.17.0"
hooks = [
  { id = "ruff-check", args = ["--fix"] },
  { id = "ruff-format" },
]

# Two passes over the markdown: docs/ uses the mkdocs flavor, everything else plain GFM.
# mdformat-frontmatter keeps both from mangling YAML front matter blocks.
[[repos]]
repo = "https://github.com/hukkin/mdformat"
rev = "1.0.0"
hooks = [
  # exclude docs/: the mkdocs flavor below handles it.
  { id = "mdformat", exclude = "^docs/", additional_dependencies = [
    "mdformat-gfm",
    "mdformat-frontmatter",
  ] },
  # Zensical sources: admonitions and content tabs need the mkdocs plugin.
  { id = "mdformat", name = "mdformat (docs)", files = "^docs/", additional_dependencies = [
    "mdformat-mkdocs",
    "mdformat-frontmatter",
  ] },
]

[[repos]]
repo = "https://github.com/PyCQA/bandit"
rev = "1.9.4"
hooks = [
  { id = "bandit", args = [
    "-c",
    "pyproject.toml",
  ], additional_dependencies = ["bandit[toml]"] },
]

[[repos]]
repo = "https://github.com/asottile/pyupgrade"
rev = "v3.22.0"
hooks = [{ id = "pyupgrade", args = ["--py314-plus"] }]

[[repos]]
repo = "https://github.com/streetsidesoftware/cspell-cli"
rev = "v10.3.0"
hooks = [
  # Spell check changed files.
  { id = "cspell" },
  # Spell check the commit message.
  { id = "cspell", name = "check commit message spelling", args = [
    "--no-must-find-files",
    "--no-progress",
    "--no-summary",
    "--files",
    ".git/COMMIT_EDITMSG",
  ], stages = ["commit-msg"], always_run = true },
]

[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "v1.51.1"
hooks = [{ id = "typos" }]

# Renovate config validator. Catches a typo in renovate.json5 before it silently breaks updates.
[[repos]]
repo = "https://github.com/renovatebot/pre-commit-hooks"
rev = "44.149.2"
hooks = [{ id = "renovate-config-validator", args = ["--strict"] }]

# Static analysis for the GitHub Actions workflows. Same tool as the zizmor.yml workflow, so a
# finding shows up here first instead of on a red CI run.
[[repos]]
repo = "https://github.com/zizmorcore/zizmor-pre-commit"
rev = "v1.30.1"
hooks = [{ id = "zizmor" }]

# Local hooks run the tool already installed in the project venv, so the hook, CI, and the commands
# AGENTS.md documents all execute the same locked version. zuban and pycroscope additionally need
# that venv to resolve the project's own third-party imports.
[[repos]]
repo = "local"

# Whole-project, never a file list: handed a subset, zuban resolves imports it cannot see
# and invents errors (a chunk holding only ai.py misreads pydantic-ai's two-parameter Agent
# as taking one). It is also the `uv run zuban check` AGENTS.md tells contributors to run.
# Through `uv run`: a bare `zuban` off PATH may be a global uv tool, not the locked one.
[[repos.hooks]]
id = "zuban"
name = "zuban type check"
entry = "uv run zuban check"
language = "system"
types = ["python"]
pass_filenames = false
require_serial = true
always_run = true

[[repos.hooks]]
id = "pycroscope"
name = "pycroscope static analysis"
entry = "uv run pycroscope --config-file pyproject.toml"
language = "system"
types = ["python"]
pass_filenames = false
require_serial = true
always_run = true

# Whole-project, like zuban: a contract is about the import graph, not one file.
[[repos.hooks]]
id = "import-linter"
name = "import-linter layering"
entry = "uv run lint-imports"
language = "system"
types = ["python"]
pass_filenames = false
require_serial = true
always_run = true

[[repos.hooks]]
id = "check-version-sync"
name = "check version sync"
entry = "uv run scripts/check_version_sync.py"
language = "system"
pass_filenames = false
files = '(pyproject\.toml|uv\.lock|SECURITY\.md|CHANGELOG\.md)'

[[repos.hooks]]
id = "check-docs-sync"
name = "check docs match the CLI"
entry = "uv run scripts/check_docs_sync.py"
language = "system"
pass_filenames = false
files = '(src/photo_tagger/.*\.py|README\.md|docs/.*\.md|check_docs_sync\.py)$'

[[repos.hooks]]
id = "check-translations"
name = "check compiled translations"
entry = "uv run scripts/compile_translations.py --check"
language = "system"
pass_filenames = false
files = '\.(po|pot|mo)$|compile_translations\.py$'
