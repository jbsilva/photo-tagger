[project]
name = "photo-tagger"
version = "0.9.0"
description = "CLI tool to describe photos and add keywords using AI"
readme = "README.md"
requires-python = ">=3.14,<4"
authors = [{ name = "Julio Batista Silva", email = "python@juliobs.com" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "photo",
    "tagging",
    "cli",
    "ai",
    "exif",
    "metadata",
    "image recognition",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "cyclopts>=5.2.0",
    "filelock>=4.1.0",
    "httpx2>=2.13.1",
    "loguru>=0.7.3",
    "pillow>=12.3.0",
    "pydantic-ai>=2.55.0",
    "pydantic>=2.14.0",
    "pyexiftool>=0.5.6",
    "rawpy>=0.27.1",
    "rich>=15.0.0",
    "tomlkit>=0.15.1",
]

[project.optional-dependencies]
# Optional desktop GUI. Kept out of the base install so the CLI stays lean and dependency-light:
# `pip install photo-tagger[gui]` pulls Qt only when wanted.
gui = ["pyside6>=6.12.0"]
# Optional OpenTelemetry export for `--otel`. Both packages arrive today anyway, as transitive
# dependencies of pydantic-ai's logfire extra, but naming them here is what makes the feature
# actually declare what it needs: pydantic-ai is free to drop that extra, and photo-tagger is free
# to move to pydantic-ai-slim, without silently breaking tracing.
otel = [
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
]

[dependency-groups]
dev = [
    "babel>=2.18.0",
    "bandit>=1.9.4",
    "poethepoet>=0.48.0",
    "pycroscope>=0.5.0",
    "ruff>=0.17.0",
    "zizmor>=1.30.1",
    "zuban>=0.10.0",
]
docs = [
    "zensical>=0.0.69",
]
package = [
    "pyinstaller>=6.22.3",
]
test = [
    "inline-snapshot>=0.36.0",
    "pytest-cov>=7.1.0",
    "pytest-random-order>=1.2.0",
    "pytest-xdist[psutil]>=3.8.0",
    "pytest>=9.1.1",
]

[project.urls]
Homepage = "https://juliobs.com/projects/photo-tagger/"
Documentation = "https://jbsilva.github.io/photo-tagger/"
Repository = "https://github.com/jbsilva/photo-tagger"
Issues = "https://github.com/jbsilva/photo-tagger/issues"

[project.scripts]
# main() wraps the cyclopts app so an unhandled crash fires an anonymous crash beacon (when
# telemetry is enabled) before the traceback surfaces.
photo-tagger = "photo_tagger.main:main"

[project.gui-scripts]
# A windowed entry point for the desktop app: on Windows it launches without a console window,
# and it gives the conda-forge photo-tagger-gui output and desktop shortcuts a direct target.
# Requires the [gui] extra (PySide6); the plain CLI install does not ship Qt.
photo-tagger-gui = "photo_tagger.gui:launch"

[tool.uv]
exclude-newer = "1 day"

[tool.uv.exclude-newer-package]
cyclopts = "6 hours"
ruff = "6 hours"
zensical = "6 hours"
zuban = "6 hours"

[build-system]
requires = ["uv_build>=0.13.0,<1.0.0"]
build-backend = "uv_build"

# Dev tasks: `uv run poe` lists them. Each task runs through `uv run`, so it uses the locked versions
# and syncs the dependency group it needs.
[tool.poe]
executor.type = "uv"

[tool.poe.tasks.lint]
help = "Lint with ruff and apply its fixes"
cmd = "ruff check --fix ."

[tool.poe.tasks.format]
help = "Format the code with ruff"
cmd = "ruff format ."

[tool.poe.tasks.typecheck]
help = "Strict type check with zuban"
cmd = "zuban check"

[tool.poe.tasks.pycroscope]
help = "Semi-static analysis with pycroscope"
cmd = "pycroscope --config-file pyproject.toml"

[tool.poe.tasks.hooks]
help = "Run every pre-commit hook on all files"
cmd = "prek run -a"
executor = { with = ["prek"] }

[tool.poe.tasks.check]
help = "Run all the checks to do before a commit"
sequence = ["lint", "format", "typecheck", "pycroscope", "hooks"]

[tool.poe.tasks.test]
help = "Run the test suite (extra arguments go to pytest)"
cmd = "pytest"
executor = { group = "test" }

[tool.poe.tasks.test-gui]
help = "Run the GUI tests headless (installs the gui extra)"
cmd = "pytest tests/test_gui.py"
env = { QT_QPA_PLATFORM = "offscreen" }
executor = { extra = "gui", group = "test" }

[tool.poe.tasks.docs]
help = "Serve the docs site locally with live reload"
cmd = "zensical serve"
executor = { group = "docs" }

[tool.poe.tasks.docs-build]
help = "Build the static docs site into site/"
cmd = "zensical build --clean"
executor = { group = "docs" }

[tool.poe.tasks.translations]
help = "Refresh the translation catalogs and recompile them"
sequence = [
    { cmd = "python scripts/extract_translations.py" },
    { cmd = "python scripts/compile_translations.py" },
]

# The dashboard is a PEP 723 script with its own sandbox venv, so it skips the project's `uv run`.
[tool.poe.groups.telemetry]
heading = "Telemetry"
executor = "simple"

[tool.poe.groups.telemetry.tasks.dashboard]
help = "Open the read-only telemetry dashboard"
cmd = "uvx marimo run --sandbox telemetry/dashboard.py"

[tool.poe.groups.telemetry.tasks.dashboard-edit]
help = "Open the telemetry dashboard as an editable notebook"
cmd = "uvx marimo edit --sandbox telemetry/dashboard.py"

[tool.poe.groups.telemetry.tasks.test-worker]
help = "Test the telemetry collector (needs Node)"
cmd = "node --experimental-detect-module --test telemetry/worker.test.mjs"

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py314"
fix = true
unsafe-fixes = false

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "CPY001", # missing-copyright-notice: this project has no copyright-header policy
    "D203",   # one-blank-line-before-class
    "D212",   # multi-line-summary-first-line
    "D413",   # blank-line-after-last-section
]

[tool.ruff.lint.per-file-ignores]
"**/tests/{test_*.py,conftest.py}" = [
    "S101",   # Allow assert in tests
    "S105",   # Allow hardcoded password in strings in tests
    "S106",   # Allow hardcoded password in function calls in tests
    "ARG001", # Allow unused arguments in tests (for pytest fixtures)
    "INP001", # No __init__.py needed — pytest uses --import-mode=importlib
    "TC001",  # Keep imports at runtime in tests; the import-cost the TC rules guard is irrelevant
    "TC002",  # here, and a TYPE_CHECKING block for a test's own framework import reads oddly.
    "TC003",
]
# The whole point of these tests is characters that look like each other but are not, so the rule
# that warns about exactly that has nothing to add here.
"**/tests/test_script_guard.py" = [
    "RUF001", # Ambiguous unicode characters are the subject under test
]
"**/__init__.py" = [
    "D104", # Allow empty __init__.py files
]
"packaging/**" = [
    "INP001",  # Build scripts, not an importable package
    "T201",    # print() is the right channel for build-time progress
    "S603",    # subprocess with fixed, trusted args (iconutil)
    "S607",    # ditto
    "PLC0415", # Intentional in-function imports (selftest probes; lazy Qt launch)
    "F401",    # selftest imports modules only to confirm they were bundled
]
# The telemetry dashboard is a marimo notebook: every cell is a `def _(dep, ...)` whose parameters
# are dependencies marimo injects from other cells, and imports live inside a cell by design. That
# shape trips a fixed set of rules that do not apply to notebook code.
"telemetry/dashboard.py" = [
    "ANN001",  # Cell params are marimo-injected dependencies, not annotated call arguments
    "ANN202",  # Every cell is an unannotated `def _(...)`
    "PLR0913", # A cell takes one param per dependency; marimo controls the signature
    "PLR0917", # Same: positional dependency params, not a call-site design choice
    "PLC0415", # marimo requires imports inside a cell so it can track them reactively
    "N803",    # COLORS flows between cells as a param; the name must match its definition
    "N806",    # COLORS is a palette constant, but a marimo cell is a function
    "S608",    # SQL is built from int-coerced window sizes against a read-only token; the free-form
    #            console runs user SQL by design. No untrusted interpolation reaches a write path.
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true
lines-after-imports = 2

[tool.docformatter]
# Reflow docstrings to the project's 100-column width. `pre-summary-newline` keeps the summary on the
# second line to match the active D213 (the D212 alternative is ignored above). The pre-commit hook
# passes `--in-place`; a bare `docformatter src` only prints a diff. A couple of files are excluded
# from the hook (see prek.toml for which and why).
recursive = true
wrap-summaries = 100
wrap-descriptions = 100
pre-summary-newline = true

[tool.zuban]
strict = true
disallow_untyped_defs = true
warn_unreachable = true
python_executable = ".venv/bin/python"

[tool.typos.default.extend-words]
# PyInstaller's Analysis(...) parameter is literally named "datas"; not a typo for "data".
datas = "datas"
# German words used as examples of what the English plural rules must not do to other languages.
Alle = "Alle"
alle = "alle"

[tool.typos.files]
# Translation catalogs are not English; the checker would flag every Portuguese word.
extend-exclude = ["src/photo_tagger/locale/**"]

[tool.pycroscope]
# Directory to analyze (relative to pyproject.toml) and the import root for the src layout
paths = ["src/photo_tagger"]
import_paths = ["src"]

# Output one issue per line, easier to scan and grep.
output_format = "concise"

# Checks
possibly_undefined_name = true
unused_variable = true
value_always_true = true
use_fstrings = true
missing_return_annotation = true
missing_parameter_annotation = true
suggested_parameter_type = true
suggested_return_type = true
incompatible_override = true
missing_generic_parameters = true

# See https://github.com/JelleZijlstra/pycroscope/issues/499
internal_error = false

# Tests intentionally use loose typing and assert helpers that pycroscope would flag as suggestions
[[tool.pycroscope.overrides]]
module = "tests"
missing_return_annotation = false
missing_parameter_annotation = false
suggested_parameter_type = false
suggested_return_type = false

# gui.py (the Qt shell) is excluded from pycroscope wholesale via a file-level
# `# static analysis: ignore` header in the module itself, because the lint job does not install
# the [gui] extra and pycroscope cannot import PySide6. See the note at the top of gui.py.

[tool.bandit]
# packaging/ and telemetry/ are dev tooling (like tests/), not shipped app code. packaging/'s only
# flagged use is a fixed-args iconutil call; telemetry/dashboard.py builds read-only Analytics SQL
# from int-coerced window sizes (B608 false positives). ruff still covers both via per-file-ignores.
exclude_dirs = [".git", ".venv", "__pycache__", "tests", "packaging", "telemetry"]

[tool.bandit.assert_used]
skips = ['tests/test_*.py']

[tool.pytest.ini_options]
addopts = [
    "-ra",
    "--durations=10",
    "--import-mode=importlib",
    "--random-order",
    "--numprocesses=logical",
    "--dist=load",
    "--tb=short",
    "--verbose",
    "--cov=src/photo_tagger",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=xml:reports/coverage.xml",
    "-m",
    "not integration",
]
markers = [
    "integration: marks tests as integration tests; deselect with '-m \"not integration\"'",
]
# Warnings are errors: a new DeprecationWarning from a dependency bump (the exact thing Renovate
# ships) must fail the suite instead of scrolling past. Add targeted `ignore::...` entries here
# when a third-party warning is genuinely not actionable.
filterwarnings = ["error"]

[tool.coverage.run]
# The PySide6 desktop window and its Qt event loop cannot run under the headless
# CI suite (no display, and the [gui] extra is intentionally not installed there).
# Its testable, Qt-free logic lives in gui_state.py, which is covered normally;
# gui.py is the widget/event-loop shell, exercised manually and by the
# offscreen-guarded tests in test_gui.py when PySide6 is present.
omit = ["src/photo_tagger/gui.py"]
