# Cloudflare Worker config for the photo-tagger telemetry collector.
#
# Deploy with:  wrangler deploy   (run from this directory)
# The account is taken from the CLOUDFLARE_ACCOUNT_ID env var (or `wrangler login`), so no
# account id is hardcoded here.

name = "photo-tagger-telemetry"
main = "worker.js"
compatibility_date = "2025-06-01"

# The Analytics Engine dataset the Worker writes to. `binding` is the name exposed to the Worker
# as env.TELEMETRY; `dataset` is what queries.sql selects FROM.
[[analytics_engine_datasets]]
binding = "TELEMETRY"
dataset = "photo_tagger_telemetry"

# Long-term storage: AE keeps three months, D1 keeps everything. OpenTofu in infra/ creates the
# database (`tofu output d1_database_id` prints this id), and CI applies the migrations in
# migrations/ before each deploy.
[[d1_databases]]
binding = "DB"
database_name = "photo-tagger-telemetry"
database_id = "fb3c2ad8-1808-4e07-bb8e-ea5b936ad7d8"
migrations_dir = "migrations"

# Serve the collector from the project's own subdomain instead of *.workers.dev. tagger.photo must
# already exist as a zone on the same Cloudflare account; Wrangler then provisions the DNS record
# and TLS certificate for this hostname on deploy.
[[routes]]
pattern = "telemetry.tagger.photo"
custom_domain = true

# At most 60 beacons a minute from one address. A run sends a handful, so only a flood reaches it.
# The address is the limiter's key and nothing else: it is never written anywhere.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"

[ratelimits.simple]
limit = 60
period = 60

# Keep the Worker's own log lines, so a failed D1 insert can be found after the fact. The
# invocation logs stay off: they would store each request's metadata, which the collector promises
# not to keep.
[observability]
enabled = true

[observability.logs]
invocation_logs = false
